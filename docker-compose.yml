# AI Hub Docker Compose Configuration (1Panel 部署版)
#
# 前置条件：
#   1. 已通过 1Panel 安装 PostgreSQL 和 Redis，并接入 1panel-network 网络
#   2. 在同目录 .env 中配置 FEISHU_APP_ID / FEISHU_APP_SECRET
#   3. docker-compose up -d 启动，服务仅监听 127.0.0.1:3000，需配合反向代理对外提供服务

version: "3.4"

services:
  new-api:
    image: quantumnous/ai-hub:latest
    # image: jahnlis/new-api:latest  # 自建镜像，部署时可切换
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://admin:semitech@1Panel-postgresql-Umtv:5432/postgres
      - REDIS_CONN_STRING=redis://:semitech@1Panel-redis-SRr2
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - FEISHU_APP_ID=${FEISHU_APP_ID}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET}
    #      - STREAMING_TIMEOUT=300
    #      - SESSION_SECRET=random_string
    #      - SYNC_FREQUENCY=60
    networks:
      - 1panel-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  1panel-network:
    external: true
